name: Docker image

# ST8WRX fork policy:
# Production container builds inherited from Buzz are intentionally parked while
# ST8WRX is in active protocol/product development. The original multi-arch
# relay + push-gateway workflow remains available in git history and should be
# restored/reworked when ST8WRX begins deploying production relay images.
#
# Do not add push or pull_request triggers here during normal development.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this inherited Docker workflow is being invoked"
        required: true
        type: string

permissions:
  contents: read

jobs:
  parked:
    name: ST8WRX Docker workflow parked
    runs-on: ubuntu-latest
    steps:
      - name: Explain current policy
        run: |
          echo "ST8WRX does not build production Docker images during normal development."
          echo "Restore/rework the inherited Buzz Docker pipeline when production deployment begins."
