name: Sprig image

# ST8WRX fork policy:
# The inherited Buzz multi-arch Sprig container pipeline is intentionally parked
# during active ST8WRX development. It should not run on pushes or pull requests.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this inherited Sprig image workflow is being invoked"
        required: true
        type: string

permissions:
  contents: read

jobs:
  parked:
    name: ST8WRX Sprig image workflow parked
    runs-on: ubuntu-latest
    steps:
      - name: Explain current policy
        run: |
          echo "ST8WRX does not build/publish Sprig container images during normal development."
          echo "Restore/rework the inherited Buzz image pipeline when production deployment requires it."
