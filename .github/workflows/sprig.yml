name: Sprig

# ST8WRX fork policy:
# The inherited Buzz Sprig binary-release pipeline is intentionally parked while
# ST8WRX is in active product/protocol development. Normal development should
# use CI, not cross-platform release packaging.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this inherited Sprig release workflow is being invoked"
        required: true
        type: string

permissions:
  contents: read

jobs:
  parked:
    name: ST8WRX Sprig workflow parked
    runs-on: ubuntu-latest
    steps:
      - name: Explain current policy
        run: |
          echo "ST8WRX does not package/publish Sprig during normal development."
          echo "Restore/rework the inherited Buzz release pipeline when a production agent distribution is needed."
